version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: insta-postgres
    environment:
      POSTGRES_DB: insta1db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - insta1data:/var/lib/postgresql/data
volumes:
  insta1data:
